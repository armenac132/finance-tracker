version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      test-stack:
        patterns: ["xunit*", "FluentAssertions", "Moq", "NSubstitute"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"